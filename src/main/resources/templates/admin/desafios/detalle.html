<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del desafío | Misión IA</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="admin-layout admin-detalle" aria-labelledby="tituloAdmin"
      th:with="estado=${desafio.activo ? 'Activo' : 'Inactivo'}, publicacion=${desafio.publicadoDiagnostico ? 'Publicado' : 'No publicado'}">
    <header class="admin-cabecera admin-detalle-cabecera">
        <div>
            <h1 id="tituloAdmin" th:text="${desafio.titulo}"></h1>
            <p>
                <span th:text="${desafio.ordenDiagnostico != null} ? |Posición ${desafio.ordenDiagnostico} · Banco de diagnóstico| : 'Banco de desafíos · Sin posición asignada'"></span>
                <span class="admin-detalle-id" th:text="| · ID ${desafio.id}|"></span>
            </p>
        </div>
        <div class="admin-detalle-controles">
            <div class="admin-estados">
                <span class="admin-estado" th:classappend="${desafio.activo} ? ' admin-activo' : ''"
                      th:text="|Estado: ${estado}|"></span>
                <span class="admin-estado" th:classappend="${desafio.publicadoDiagnostico} ? ' admin-activo' : ''"
                      th:text="|Publicación: ${publicacion}|"></span>
            </div>
            <div class="admin-acciones">
                <a class="admin-boton" th:href="@{/admin/desafios/{id}/editar(id=${desafio.id})}">Editar</a>
                <form method="post" th:action="@{/admin/desafios/{id}/estado(id=${desafio.id})}">
                    <button class="admin-boton" type="submit" name="activo" th:value="${!desafio.activo}"
                            th:text="${desafio.activo} ? 'Desactivar' : 'Reactivar'"></button>
                </form>
                <a class="admin-boton" th:href="@{/admin/desafios}">← Banco de desafíos</a>
            </div>
        </div>
    </header>

    <div class="admin-detalle-grid">
        <section class="admin-panel admin-detalle-panel" aria-labelledby="detalleEnunciado">
            <h2 id="detalleEnunciado">Enunciado</h2>
            <p th:text="${desafio.enunciado}"></p>
        </section>

        <section class="admin-panel admin-detalle-panel" aria-labelledby="detalleConfiguracion">
            <h2 id="detalleConfiguracion">Configuración</h2>
            <dl class="admin-detalle-config">
                <div><dt>Habilidad principal</dt><dd th:text="${desafio.habilidadPrincipal.etiqueta}"></dd></div>
                <div><dt>Habilidad secundaria</dt><dd th:text="${desafio.habilidadSecundaria?.etiqueta ?: 'Sin asignar'}"></dd></div>
                <div><dt>Puntaje del juego</dt><dd th:text="${desafio.puntajeJuego}"></dd></div>
                <div><dt>Posición en el diagnóstico</dt><dd th:text="${desafio.ordenDiagnostico != null} ? ${#numbers.formatInteger(desafio.ordenDiagnostico, 2)} : 'Sin asignar'"></dd></div>
                <div><dt>Estado</dt><dd th:text="${estado}"></dd></div>
                <div><dt>Publicación</dt><dd th:text="${publicacion}"></dd></div>
            </dl>
        </section>

        <section class="admin-panel admin-detalle-panel admin-detalle-alternativas" aria-labelledby="detalleAlternativas">
            <h2 id="detalleAlternativas">Alternativas</h2>
            <ul class="admin-detalle-opciones" role="list" th:with="letras=${ {'A', 'B', 'C', 'D'} }">
                <li class="admin-detalle-opcion"
                    th:each="opcion, indice : ${ {desafio.opcionA, desafio.opcionB, desafio.opcionC, desafio.opcionD} }"
                    th:with="letra=${letras[indice.index]}, correcta=${letra == desafio.respuestaCorrecta}"
                    th:unless="${#strings.isEmpty(#strings.trim(opcion))}"
                    th:classappend="${correcta} ? 'admin-detalle-opcion-correcta' : ''">
                    <span class="admin-detalle-letra" th:text="${letra}"></span>
                    <span class="admin-detalle-marca" th:if="${correcta}">✓ Opción correcta</span>
                    <p th:text="${opcion}"></p>
                </li>
            </ul>
        </section>

        <div class="admin-detalle-inferior">
            <section class="admin-panel admin-detalle-panel" aria-labelledby="detalleNia">
                <h2 id="detalleNia">Mensaje de NIA</h2>
                <p th:text="${#strings.defaultString(desafio.mensajeNia, 'Sin mensaje')}"></p>
            </section>
            <section class="admin-panel admin-detalle-panel" aria-labelledby="detalleFeedback">
                <h2 id="detalleFeedback">Feedback</h2>
                <div class="admin-detalle-feedback">
                    <div>
                        <h3>✓ Feedback correcto</h3>
                        <p th:text="${#strings.defaultString(desafio.feedbackCorrecto, 'Sin feedback')}"></p>
                    </div>
                    <div>
                        <h3>⚠ Feedback incorrecto</h3>
                        <p th:text="${#strings.defaultString(desafio.feedbackIncorrecto, 'Sin feedback')}"></p>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
